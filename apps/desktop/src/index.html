<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; img-src data: https: http:;">
  <title>PrepArea Desktop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    .logo {
      font-size: 64px;
      font-weight: bold;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .tagline {
      font-size: 20px;
      color: #94a3b8;
      margin-bottom: 48px;
    }

    .loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .spinner {
      width: 64px;
      height: 64px;
      border: 4px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 16px;
      color: #64748b;
    }

    .progress-bar {
      width: 300px;
      height: 4px;
      background: rgba(59, 130, 246, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 2px;
      animation: progress 2s ease-in-out infinite;
    }

    @keyframes progress {
      0% { width: 0%; margin-left: 0; }
      50% { width: 70%; margin-left: 15%; }
      100% { width: 0%; margin-left: 100%; }
    }

    .version-info {
      position: absolute;
      bottom: 20px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">PrepArea</div>
    <div class="tagline">Your Study Community for Competitive Exams</div>

    <div class="loading-indicator">
      <div class="spinner"></div>
      <div class="status-text" id="status">Connecting to server...</div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <div class="version-info" id="version">PrepArea Desktop v1.0.0</div>

  <script>
    // Show loading state
    const statusEl = document.getElementById('status');
    const versionEl = document.getElementById('version');

    // Check if we have access to electron API
    const hasElectronAPI = typeof window.electronAPI !== 'undefined';

    if (hasElectronAPI) {
      // Get version from main process
      window.electronAPI.getVersion().then(version => {
        versionEl.textContent = `PrepArea Desktop v${version}`;
      }).catch(() => {
        versionEl.textContent = 'PrepArea Desktop v1.0.0';
      });
    }

    // Simulate connection progress
    let progress = 0;
    const statuses = [
      'Connecting to server...',
      'Loading resources...',
      'Preparing interface...',
      'Almost ready...'
    ];

    const progressInterval = setInterval(() => {
      progress += Math.random() * 15;
      if (progress >= 90) {
        progress = 90;
        clearInterval(progressInterval);

        // Try to load the web app after a short delay
        setTimeout(() => {
          statusEl.textContent = 'Launching PrepArea...';

          // Redirect to the actual web app
          window.location.href = 'https://web-sepia-chi-87.vercel.app';
        }, 500);
      }
    }, 300);

    // Fallback: if no response in 10 seconds, try to load anyway
    setTimeout(() => {
      if (progress < 90) {
        clearInterval(progressInterval);
        statusEl.textContent = 'Launching PrepArea...';
        window.location.href = 'https://web-sepia-chi-87.vercel.app';
      }
    }, 10000);
  </script>
</body>
</html>
